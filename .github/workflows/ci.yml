name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: clinic_migrator
          POSTGRES_PASSWORD: dental_ci_migration_only
          POSTGRES_DB: dental_test
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U clinic_migrator -d dental_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://clinic_runtime:dental_ci_runtime_only@127.0.0.1:54329/dental_test
      MIGRATION_DATABASE_URL: postgresql://clinic_migrator:dental_ci_migration_only@127.0.0.1:54329/dental_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - run: pnpm env:check
      - run: pnpm db:migrate
      - run: pnpm db:prepare-runtime
      - run: pnpm db:verify
      - run: pnpm db:verify-patients
      - run: pnpm db:verify-messaging
      - run: pnpm db:verify-finance
      - run: pnpm db:verify-visits
      - run: pnpm db:verify-plans
      - run: pnpm db:verify-follow-ups
      - run: pnpm db:verify-timeline
